<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="container mt-4">

    <header class="mb-4">
        <h1>Perfil</h1>
    </header>

    <main>
        <!-- mensagem de alerta (vazia por padrão) -->
        <div class="alert alert-info" role="alert" id="mensagem" style="display: none;"></div>

        <form id="formPerfil">
            <div class="mb-3">
                <img src="simple-avatar-design-concept-for-profile-icon-person-silhouette-on-isolated-transparent-ambience-png.webp" alt="Avatar" width="200" class="img-thumbnail">
            </div>

            
            <div class="mb-3">
                <label for="nome" class="form-label">Nome:</label>
                <input type="text" class="form-control" id="nome" name="nome" value="Seu nome">
            </div>

           
            <div class="mb-3">
                <label for="nascimento" class="form-label">Data de Nascimento:</label>
                <input type="date" class="form-control" id="nascimento" name="nascimento">
            </div>

            <!-- campo cpf -->
            <div class="mb-3">
                <label for="cpf" class="form-label">CPF:</label>
                <input type="text" class="form-control" id="cpf" name="cpf" value="000.000.000-00">
            </div>

            <!-- Elementos Avançados de Formulário -->
            <hr class="my-4">
            <h2 class="h4 mb-3">Informações Adicionais</h2>

            <!-- Botões de Rádio (radio) -->
            <div class="mb-3">
                <label class="form-label d-block">Gênero:</label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="genero" id="generoM" value="Masculino">
                    <label class="form-check-label" for="generoM">Masculino</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="genero" id="generoF" value="Feminino">
                    <label class="form-check-label" for="generoF">Feminino</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="genero" id="generoO" value="Outro">
                    <label class="form-check-label" for="generoO">Outro</label>
                </div>
            </div>

            <!--checkbox-->
            <div class="mb-3">
                <label class="form-label d-block">Áreas de Interesse:</label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" name="interesses" id="checkHtml" value="HTML/CSS">
                    <label class="form-check-label" for="checkHtml">HTML / CSS</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" name="interesses" id="checkJs" value="JavaScript">
                    <label class="form-check-label" for="checkJs">JavaScript</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" name="interesses" id="checkBackend" value="Back-end">
                    <label class="form-check-label" for="checkBackend">Back-end</label>
                </div>
            </div>

            
            <div class="mb-3">
                <label for="escolaridade" class="form-label">Nível de Escolaridade:</label>
                <select class="form-select" id="escolaridade" name="escolaridade">
                    <option value="">Selecione uma opção...</option>
                    <option value="Ensino Médio">Ensino Médio</option>
                    <option value="Ensino Superior">Ensino Superior</option>
                    <option value="Pós-graduação">Pós-graduação</option>
                </select>
            </div>

           
            <div class="mb-3">
                <label for="bio" class="form-label">Biografia / Resumo Profissional:</label>
                <textarea class="form-control" id="bio" name="bio" rows="4" placeholder="Fale um pouco sobre você..."></textarea>
            </div>

            
            <div class="mb-3">
                <button type="button" onclick="salvarPerfil()" class="btn btn-primary">Salvar Alterações</button>
            </div>
        </form>
    </main>

    
    <script>
        function salvarPerfil() {
            const msgContainer = document.querySelector('#mensagem');
            const cpf = document.querySelector('#cpf').value.replace(/[^\d]+/g, ''); // Extrai apenas os números

            // Captura dos novos elementos avançados
            const generoEl = document.querySelector('input[name="genero"]:checked');
            const genero = generoEl ? generoEl.value : 'Não informado';

            const interessesEl = document.querySelectorAll('input[name="interesses"]:checked');
            const interesses = Array.from(interessesEl).map(el => el.value);

            const escolaridade = document.querySelector('#escolaridade').value;
            const bio = document.querySelector('#bio').value;

            // Validação do CPF
            if (cpf.length !== 11) {
                msgContainer.innerHTML = '<strong>Erro:</strong> O CPF deve conter exatamente 11 dígitos!';
                msgContainer.className = 'alert alert-danger';
                msgContainer.style.display = 'block';
                return;
            }

            
            if (!escolaridade) {
                msgContainer.innerHTML = '<strong>Atenção:</strong> Por favor, selecione seu nível de escolaridade.';
                msgContainer.className = 'alert alert-warning';
                msgContainer.style.display = 'block';
                return;
            }

            function validarData(dataInput) {
    if (!dataInput) return false;

    const nascimento = new Date(dataInput);
    const hoje = new Date();
    
    // Define a data limite (exatamente 80 anos atrás)
    const limite80Anos = new Date();
    limite80Anos.setFullYear(hoje.getFullYear() - 80);

    // Aceita apenas datas iguais ou anteriores a 80 anos atrás
    // (Isso já bloqueia datas no futuro e idades novas como 6 anos)
    return nascimento <= limite80Anos;
}

            // Exibição de sucesso com os dados processados
            const interessesTexto = interesses.length > 0 ? interesses.join(', ') : 'Nenhum selecionado';
            
            msgContainer.innerHTML = `
                <strong>Informações do Perfil Salvas com Sucesso!</strong><br>
                <small>
                    <b>Gênero:</b> ${genero} | 
                    <b>Escolaridade:</b> ${escolaridade} | 
                    <b>Interesses:</b> ${interessesTexto}
                </small>
            `;
            msgContainer.className = 'alert alert-success';
            msgContainer.style.display = 'block';
        }
    </script>
</body>
</html>
